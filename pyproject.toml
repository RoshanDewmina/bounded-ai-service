[project]
name = "bounded-ai-service"
version = "0.1.0"
description = "A policy-enforced service request assistant with inspectable tool traces"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
[project.optional-dependencies]
model = ["transformers>=4.57,<5", "torch>=2.6,<3"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.hatch.build.targets.wheel]
packages = ["src/bounded_ai"]
